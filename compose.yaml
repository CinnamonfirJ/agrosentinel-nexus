services:
  agrosentinel:
    build: .
    env_file:
      - .env
    ports:
      - "3000:3000"
    volumes:
      - agro-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 30s
volumes:
  agro-data:
